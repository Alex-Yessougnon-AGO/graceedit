name: Contrôles

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  controles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      # Portes du §6 d'AGENTS.md : format, analyse, tests.
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze --no-pub
      - run: flutter test
